# Two panes, so Alt shows ⌥←↓↑→. Column 116 is the ↓ in that combo.
# Each arrow is its own hit target, so only that cell inverts.
name: hover-focus
plugin: ../target/wasm32-wasip1/release/plugin.wasm
geometry:
  rows: 1
  cols: 160
steps:
  - action: grant_permissions
  - action: mode_update
    mode: normal
    session: demo
  - action: tab_update
    tabs:
      - name: Tab
        active: true
        tiled: 2
  - action: event_json
    json: '{"Mouse":{"Hover":[0,116]}}'
