# Session mode. "Session" is the far-left heading, before "Ctrl +".
# In-mode keys are unmodified (D Detach, L Layout Manager).
name: session
plugin: ../target/wasm32-wasip1/release/plugin.wasm
geometry:
  rows: 1
  cols: 160
steps:
  - action: grant_permissions
  - action: mode_update
    mode: session
    session: demo
  - action: tab_update
    tabs:
      - name: Tab
        active: true
        tiled: 1
