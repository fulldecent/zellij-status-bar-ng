# Tab mode. "Tab" is the far-left heading, before "Ctrl +".
name: tab
plugin: ../target/wasm32-wasip1/release/plugin.wasm
geometry:
  rows: 1
  cols: 160
steps:
  - action: grant_permissions
  - action: mode_update
    mode: tab
    session: demo
  - action: tab_update
    tabs:
      - name: Tab
        active: true
        tiled: 1
